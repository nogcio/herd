name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: 'line-tables-only'
  CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'

jobs:
  rust:
    name: Rust (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [core, applet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Native development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev desktop-file-utils appstream dbus-daemon
      - name: Select repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: source-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mode }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Core contracts
        if: matrix.mode == 'core'
        run: cargo xtask check --scope core
      - name: Applet contracts
        if: matrix.mode == 'applet'
        run: cargo xtask check --scope applet

  repository:
    name: Documentation and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup show active-toolchain
      - name: Install reviewed documentation tools
        run: |
          cargo install rumdl --version 0.3.0 --locked
          cargo install lychee --version 0.24.2 --locked
      - name: Documentation
        run: cargo xtask docs
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Working-tree, staged and history secrets
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: cargo xtask secrets

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup show active-toolchain
      - name: Install reviewed auditor
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo xtask audit

  required:
    name: CI required
    if: ${{ always() }}
    needs: [rust, repository, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on every prerequisite
        if: ${{ needs.rust.result != 'success' || needs.repository.result != 'success' || needs.dependencies.result != 'success' }}
        run: exit 1
      - run: echo 'All required source checks passed. Native acceptance is separate.'
