[package]
name = "herd"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Native COSMIC controls and CLI for a local llama.cpp router"
readme = "README.md"
repository = "https://github.com/nogcio/herd"
homepage = "https://github.com/nogcio/herd"
# GitHub source publication is supported; registry/binary distribution is separate.
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"

[lints]
workspace = true

[features]
default = []
applet = ["dep:cosmic", "dep:i18n-embed", "dep:rust-embed"]

[[bin]]
name = "herd-cosmic"
path = "src/main.rs"
required-features = ["applet"]

[[bin]]
name = "herd-cosmic-applet"
path = "src/bin/applet.rs"
required-features = ["applet"]

[[bin]]
name = "herd-service"
path = "src/bin/service.rs"

[[bin]]
name = "herd-status"
path = "src/bin/status.rs"

[[bin]]
name = "herd"
path = "src/bin/cli.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
notify = "8.2"
configparser = "3.3"
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustix = { version = "1.1.5", features = ["fs"] }
eventsource-stream = "0.2.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
url = "2"
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", optional = true, default-features = false, features = ["applet", "a11y", "tokio", "wayland", "wgpu", "single-instance", "process", "xdg-portal"] }
i18n-embed = { version = "0.16.0", optional = true, features = ["fluent-system", "desktop-requester"] }
rust-embed = { version = "8.13.0", optional = true, features = ["debug-embed"] }

[dev-dependencies]
assert_cmd = "2.1"
wiremock = "0.6"

# Upstream replaces archived basic-toml with maintained toml; remove this patch
# when a crates.io i18n-config release contains cargo-i18n PR #176.
[patch.crates-io]
i18n-config = { git = "https://github.com/kellpossible/cargo-i18n", rev = "2ce7b1dfe9a8cc224288bf50cbc2a67a6de863c4" }
